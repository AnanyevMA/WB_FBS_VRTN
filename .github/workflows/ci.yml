name: CI Test & Build

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run pytest test suite
        env:
          DATABASE_URL: sqlite+aiosqlite:///./wbfbs.db
          DATABASE_URL_SYNC: sqlite:///./wbfbs.db
          SECRET_KEY: ci-test-secret-key-32-chars-long-abcdef
          JWT_SECRET_KEY: ci-test-jwt-secret-key-32-chars-long
          ENCRYPTION_KEY: jK4hdZuYiftat9StWo41NqsmE9HHzxj5I6tMNq4LgnA=
        run: |
          pytest tests/ -v

      - name: Test Docker image build
        run: |
          docker build -t wb-fbs-manager:test .
# WB FBS Manager — Nginx Server Block (HTTP Mode / Initial Setup)

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Let's Encrypt ACME Challenge Directory
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Static frontend files (served directly by Nginx for high performance)
    location /static/ {
        alias /app/frontend/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri $uri/ =404;
    }

    location = /favicon.svg {
        alias /app/frontend/favicon.svg;
        expires 30d;
    }

    # FastAPI backend proxy
    location / {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Disable buffering for streaming responses if needed
        proxy_buffering off;
    }
}